name: kotlin-setup
description: Cache the Kotlin Toolchain distribution and its shared caches (JDKs, Maven artifacts, Kotlin/Native)
runs:
  using: "composite"
  steps:
    - name: Cache Kotlin Toolchain
      uses: actions/cache@v4
      with:
        # Default shared cache locations on Linux, macOS and Windows; paths that do not exist are skipped.
        path: |
          ~/.cache/JetBrains/Kotlin
          ~/Library/Caches/JetBrains/Kotlin
          ~/AppData/Local/JetBrains/Kotlin
        key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', 'templates/*.yaml', 'gradle/libs.versions.toml') }}
        restore-keys: kotlin-toolchain-${{ runner.os }}-
