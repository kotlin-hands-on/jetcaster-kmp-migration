name: Publish Application on GitHub Pages
on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Kotlin/Wasm
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Kotlin Toolchain setup
      uses: ./.github/actions/kotlin-setup

    - name: Build Wasm distribution
      run: ./kotlin build -m wasmApp -v release
      env:
        KOTLIN_CLI_NO_WELCOME_BANNER: "1"

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: build/tasks/_wasmApp_buildWasmJsAppWasmJsRelease/

  deploy:
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
