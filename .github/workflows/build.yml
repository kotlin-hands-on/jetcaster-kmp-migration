name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  KOTLIN_CLI_NO_WELCOME_BANNER: "1"

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Kotlin Toolchain setup
        uses: ./.github/actions/kotlin-setup

      - name: Run unit tests
        run: ./kotlin test -p jvm

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "build/reports/"

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Kotlin Toolchain setup
        uses: ./.github/actions/kotlin-setup

      - name: Build Android debug APK
        run: ./kotlin build -m androidApp

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/tasks/_androidApp_buildAndroidDebug/*.apk

  build-ios:
    name: Build iOS simulator app
    runs-on: macos-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Kotlin Toolchain setup
        uses: ./.github/actions/kotlin-setup

      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      # The "Build Kotlin" phase in the Xcode project calls ./kotlin tool xcode-integration.
      # The iosApp scheme is generated by the Kotlin Toolchain (named after the module) and kept in sync by it.
      # Derived data must not go to ./build: that is the Kotlin Toolchain's own output directory.
      - name: Build iOS simulator app
        run: |
          xcodebuild build \
          -project iosApp/module.xcodeproj \
          -configuration Debug \
          -scheme iosApp \
          -sdk iphonesimulator \
          -arch arm64 \
          -derivedDataPath ./build-xcode \
          -verbose

      - name: Upload App Folder
        uses: actions/upload-artifact@v4
        with:
          name: iphonesimulator-app
          path: build-xcode/Build/Products/Debug-iphonesimulator/*

  build-desktop:
    name: Build Desktop ${{ matrix.format }}
    needs: test
    strategy:
      matrix:
        include:
          - { os: macos-latest, format: dmg }
          - { os: windows-latest, format: msi }
          - { os: ubuntu-latest, format: deb }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Kotlin Toolchain setup
        uses: ./.github/actions/kotlin-setup

      # The Kotlin Toolchain cannot make native installers; scripts/package-desktop.sh wraps jpackage.
      - name: Build ${{ matrix.format }}
        shell: bash
        run: scripts/package-desktop.sh ${{ matrix.format }}

      - name: Upload ${{ matrix.format }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.format }}
          path: desktopApp/build-dist/${{ matrix.format }}/*

  build-wasm:
    name: Build Wasm
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Kotlin Toolchain setup
        uses: ./.github/actions/kotlin-setup

      - name: Build Wasm distribution
        run: ./kotlin build -m wasmApp -v release

      - name: Upload Wasm app
        uses: actions/upload-artifact@v4
        with:
          name: wasm-app
          path: build/tasks/_wasmApp_buildWasmJsAppWasmJsRelease/
